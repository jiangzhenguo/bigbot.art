appId: art.bigbot.desktop
productName: BigBotArt
copyright: Copyright © 2026 姜振国
electronVersion: 38.8.6
asar: true
# spawn 用 ELECTRON_RUN_AS_NODE,读不了 app.asar。
# 整份 node_modules 解包,worker 才能用 Node 原生 ESM 加载 pi-ai。
# 不要改回 esbuild 单文件:循环依赖会让 ModelsImpl 未初始化,
# 对话报 "ModelsImpl is not a constructor"。
asarUnpack:
  - "**/node_modules/**"
npmRebuild: false
files:
  - out/**/*
  - package.json
  - node_modules/**/*
  - "!**/*.map"
  - "!**/*.{ts,tsx}"
  - "!**/{test,__tests__,tests}/**"
mac:
  category: public.app-category.graphics-design
  icon: resources/icon.png
  # 本机没有 Developer ID。ad-hoc 签名让这台 Mac 能打开;发给别人仍需右键打开。
  # 不开 Hardened Runtime:没有证书时它会拦掉未签名的动态库,应用打得开却起不来。
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - target: dmg
      arch:
        - arm64
dmg:
  title: BigBotArt
artifactName: ${productName}-${version}-${arch}.${ext}
